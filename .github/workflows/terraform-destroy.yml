name: Terraform Destroy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  AWS_REGION: us-east-1
  TF_STATE_KEY: terraform-assignment1/terraform.tfstate

jobs:
  destroy-plan:
    name: Terraform destroy plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_ID }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="key=${{ env.TF_STATE_KEY }}" -backend-config="region=${{ env.AWS_REGION }}"

      - name: Check Terraform state
        shell: bash
        run: |
          resources=$(terraform state list 2>/dev/null || true)
          if [ -z "$resources" ]; then
            echo "No Terraform-managed resources were found in the configured state."
            exit 1
          fi

      - name: Terraform destroy plan
        run: terraform plan -destroy -input=false

  destroy:
    name: Terraform destroy
    needs: destroy-plan
    environment: terraform-destroy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_ID }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="key=${{ env.TF_STATE_KEY }}" -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve
